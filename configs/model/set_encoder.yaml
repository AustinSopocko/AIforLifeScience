# Stretch S-4 only.
name: set_encoder
input: {bin_ms: 100, window_s: 300, population_rate_channel: true}
electrode_encoder: {type: dilated_cnn1d, channels: 32, kernel: 5, dilations: [1, 4, 16]}
pooling: [attention_pma_1seed, mean, max]
embedding_dim: 32
augment: {electrode_subsample_min: 16, electrode_subsample_max: 60}
use_electrode_coordinates: false     # deliberately off (Claim C); ablation only
ensemble: {members: 5, bagging_unit: prep}
