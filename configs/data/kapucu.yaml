verified_preps:   # culture-date token -> plates, DIVs (PLAN §2.2)
  hPSC_20517:  {plates: [hPSC_MEA1, hPSC_MEA2], divs: [3, 7, 10, 14, 17, 21, 24, 28, 31, 35, 38, 42, 45, 48, 51, 56, 59, 63, 66]}
  hPSC_171017: {plates: [hPSC_MEA4], divs: [21, 24, 28]}
  hPSC_21018:  {plates: [hPSC_MEA5], divs: [70, 73, 77]}
  Rat_190617:  {plates: [Rat_MEA1],  divs: [2, 7, 10, 14, 17, 21, 24, 28, 31, 35]}
  Rat_250417:  {plates: [Rat_MEA3],  divs: [21, 24, 28]}
  Rat_31017:   {plates: [Rat_MEA4],  divs: [24, 28, 31]}
inferential_use: false       # one prep carries the whole hPSC age series; see PLAN §2.2
redistribution: allowed_with_attribution
