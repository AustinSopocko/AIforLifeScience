# CI profile: <5 min. 2 Potter batches x 4 DIVs, NFA 2% subsample; ensemble 1; few resamples; no lockbox.
include: [data/potter.yaml, data/nfa.yaml, features/potter_handcrafted.yaml, features/nfa17.yaml,
          model/set_encoder.yaml, model/ridge_age.yaml, train/pretext.yaml, eval/baselines.yaml]
potter_subset: {batches: 2, divs_per_culture: 4}
nfa_subsample_fraction: 0.02
ensemble_members: 1
epochs: 2
bootstrap_resamples: 200
permutations: 50
canary_seeds: 1
lockbox: false
