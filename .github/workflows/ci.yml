# WI-01/WI-02. Runs invariant tests and ledger verification on every push.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q
      # Enabled once WI-02 lands:
      # - run: agepretext ledger verify --against origin/${{ github.base_ref || 'main' }}
      # - run: bash reproduce.sh --profile smoke
