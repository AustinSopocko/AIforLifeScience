# S0 CI: clean CPU install from the lockfile, stub tests, and the entry point must exit 0.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.lock && pip install -q -e . --no-deps
      - run: pytest -q -rN --no-header
      - run: bash reproduce.sh --profile smoke
      - run: bash reproduce.sh --profile mvr
