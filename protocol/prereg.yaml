# Machine-readable preregistration v4 (Phase 2 research restructure). DRAFT: binding at Seal 2 (architecture freeze).
# eval/verdicts.py reads decision rules ONLY from this file. Prose twin: PREREGISTRATION.md (YAML wins on disagreement).
# v3 (Seal 1) is archived by content in protocol/archive/seal-1/ and stays verifiable against protocol/seals/seal-1.json.
schema_version: 4
status: draft
open_decisions: [D21]          # seal() refuses while non-empty or while any TBD_SEAL2 remains

provenance:
  seal_1: {seal_id: seal-1, protocol_hash: 4991da0c, git_commit: 353cc113, archive: protocol/archive/seal-1/}
  seal_1_record: "H-AGE-P REFUTES under the unpaired relative rule (ledger rows 16-18). The result stands as reported."
  seal_1_withdrawn_unrun: [H-AGE-N, H-A, H-B, H-C1, H-C2]   # never run; superseded by this protocol, no data touched for them
  paired_rule_adoption: prospective_on_dev   # adopted after Seal 1; never re-applied to the Seal-1 H-AGE-P result

data_roles:
  unit: cluster_id                # "<lab>:<prep>"; EPAmeadev + EPA-MI culture dates that coincide are one cluster
  manifest: splits/dev_confirmatory.json
  dev: {sources: [potter, epameadev, epa_mi, g2chvc, fragilex], labs: [potter_gatech, epa_shafer, eglen_grant, giugliano],
        clusters: 56, use: unlimited_tuning_every_run_ledgered}
  confirmatory: {sources: [nfa, kapucu_rat], clusters: 20, use: one_run_under_seal_2_clean_tree,
                 nfa_note: "same lab (epa_shafer) as dev EPA corpora: unseen preps, NOT an unseen lab; feature table only (no spikes)",
                 kapucu_note: "only unseen-lab corpus; 3 rat preps; spike-level"}
  deferred: {kcl_organoids: "D20: not ingested until the architecture is frozen"}

qc:
  min_duration_s: 600             # Seal-1 Potter rule, applied to every spike-level source at binning
  duration_definition: "stored recording length (g2chvc recordingtime) else last spike time"
  potter_max_spike_time_s: 3600
  known_bias: "last-spike length drops 3 EPAmeadev DIV-2 plate recordings (144 well rows) for silence, an age-correlated exclusion; revisable on dev before Seal 2, every change ledgered"

statistics:
  bootstrap: {method: cluster_percentile, n_resamples: 4000, ci: 0.95, seed: 20261005, min_clusters: 5}
  permutation: {n_permutations: 1000, seed: 20261006}
  error_weighting: cluster_equal   # MAE = mean over clusters of the within-cluster mean |error|; EPA (5,040 rows) cannot dominate
  lolo_aggregate: lab_equal        # LOLO statistic = mean over the 4 held-out labs of the cluster-weighted MAE
  lolo_resampling: clusters_within_lab   # stratified: each resample keeps every lab, resamples its clusters
  age_target: log_div

decision_rule:
  name: paired_vs_each_gating_baseline
  statistic: "delta_b = stat(claim) - stat(b), both on the SAME cluster resample"
  lower_is_better: "for every b in gating_baselines: upper_bound(delta_b) < 0"
  higher_is_better: "for every b in gating_baselines: lower_bound(delta_b) > 0"
  otherwise: REFUTES
  if_bound_not_computable: INCONCLUSIVE
  min_effect: none                 # D5 carried over: no absolute thresholds

identity_rule:
  SUPPORTS: "canary_power >= required_power and real_identity_p >= detection_alpha"
  REFUTES: "canary_power >= required_power and real_identity_p < detection_alpha"
  INCONCLUSIVE: "canary_power < required_power"

dev_evaluation:                    # binding on HOW dev is scored; dev results are phase=exploratory and carry no claim
  primary:
    name: leave_one_lab_out
    manifest: splits/dev_lolo.json
    folds: [eglen_grant, epa_shafer, giugliano, potter_gatech]
    fit: "every transform, model and baseline refit on the 3 training labs only"
    metric: {name: mae_log_div, direction: lower}
    gating_baselines: [BL-0, BL-1]
    rule: decision_rule
    reported: [per_fold_delta_with_cluster_ci, worst_fold, per_div_error]
  secondary_required:
    name: overlap_stratum
    div: [7, 12]                   # every dev lab has recordings here (eglen 7/9/10/11, epa 7/9/12, giugliano 7/9/11, potter 7-12)
    analysis: "the primary LOLO analysis restricted to held-out recordings with DIV in [7, 12]; models unchanged"
    always_reported: true
    interpretation: "primary passes but stratum fails -> the advantage is not shown where labs overlap in age; report as possibly lab-age confounded"
  reported:
    name: pooled_cluster_cv
    folds: {type: group_kfold_stratified_by_lab, k: 4, unit: cluster_id, seed: 20261007}
    gating_baselines_for_contrast: [BL-0, BL-1, BL-LAB]
    purpose: "shows the lab shortcut: within-lab-seen evaluation where BL-LAB (lab mean log-DIV) is available"

hypotheses:                        # confirmatory; run once under Seal 2
  H-AGE-K:
    role: primary_age_transfer
    corpus: kapucu_rat
    clusters: ["kapucu_tuni:190617", "kapucu_tuni:250417", "kapucu_tuni:31017"]
    model: "final pooled encoder + age head, trained on all 56 dev clusters (architecture frozen at Seal 2)"
    metric: {name: mae_log_div, direction: lower}
    gating_baselines: [BL-0, BL-1]   # both trained on all dev clusters
    inference: {rule: worst_fold, unit_within_fold: well, require_all_folds: true}   # 3 clusters < min_clusters: within-prep only
    scope: "within these 3 preps; no inference over preps or labs"
  H-LAB:
    role: credibility_wording
    corpus: dev
    representation: "final pooled encoder z, recordings with DIV in [7, 12]"
    probe: {type: multinomial_logistic_innercv, target: lab, split: group_kfold_by_cluster_stratified_by_lab, k: 4}
    statistic: excess_balanced_accuracy
    permutation_level: cluster
    canary:
      artefact: lab_specific_noisy_electrodes
      electrode_fraction: 0.10
      added_rate: stratum_median_electrode_rate
      inject_into: training_data
      retrain: true
      retrain_members: 1
      seeds: 20
      detection_alpha: 0.05
      required_power: 0.8
    verdict: {rule: identity_rule}
    reported: [rat_cortex_only_potter_vs_epa, mouse_cortex_only_giugliano_vs_eglen_ctx, handcrafted_probe]
    wording:
      SUPPORTS: "lab identity is not decodable from the representation within DIV 7-12"
      REFUTES: "lab identity is decodable; species, region, platform and lab are confounded and cannot be separated; LOLO is the only cross-lab age evidence"
      INCONCLUSIVE: "underpowered"
  PHASE4_BATTERY: TBD_SEAL2        # downstream battery (transfer, readout) incl. any NFA feature-level hypothesis; specified before Seal 2

baselines:
  BL-0:   {type: predict_train_mean}
  BL-1:   {type: ridge, inputs: [log1p_mean_firing_rate, log1p_network_burst_rate], alpha: 1.0, standardise: train_fold,
           features: configs/features/potter_handcrafted.yaml}
  BL-LAB: {type: predict_train_lab_mean, gating: false, only_in: pooled_cluster_cv}

seal_2:
  trigger: architecture_frozen_on_dev
  requires: [open_decisions empty, no TBD_SEAL2, PHASE4_BATTERY specified, compute plan fixed]
  confirmatory_runs: 1
