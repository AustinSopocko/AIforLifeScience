# Pipeline P age-pretext encoder (CORE). All values fixed at Seal #1; no tuning (D2b).
# G-time (2026-10-06): shrink ladder steps 1-2 applied (400 ms bins, channels [8,16,16]); projection 6.23 h <= 8 h.
name: set_encoder
input: {bin_ms: 400, window_s: 120, population_rate_channel: true, windows_per_recording_per_epoch: 2}
electrode_encoder: {type: dilated_cnn1d, channels: [8, 16, 16], kernel: 5, dilations: [1, 4, 16]}
pooling: [attention_pma_1seed, mean, max]
embedding_dim: 32
augment: {electrode_subsample_min: 16, electrode_subsample_max: all}
use_electrode_coordinates: false
age_head: linear_per_species
ensemble: {members: 1, bagging_unit: batch}   # cut 4
g_time:                       # D8: real data, before Seal #1
  measure: one_forward_backward_on_one_potter_culture_all_recordings
  project: [crossfit_4_folds_x_members, final_x_members, canary_10_retrains, kapucu_bl_a2_fits]
  max_projected_wallclock_h: 8          # operator revision 2026-10-05: 4 h was a proxy for one overnight run
  shrink_ladder: [{bin_ms: 400}, {channels: [8, 16, 16]}, {epochs: 25}, {members: 1}]   # apply in order until <= 4h; ledger each step
